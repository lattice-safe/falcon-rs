[package]
name = "falcon-rs"
version = "0.4.0-rc.1"
edition = "2021"
rust-version = "1.84"
authors = ["lattice-safe contributors"]
description = "Native Rust implementation of FN-DSA (draft FIPS 206), the NIST post-quantum digital signature scheme formerly known as Falcon"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lattice-safe/falcon-rs"
homepage = "https://github.com/lattice-safe/falcon-rs"
documentation = "https://docs.rs/falcon-rs"
keywords = [
    "fn-dsa",
    "fips-206",
    "post-quantum",
    "cryptography",
    "digital-signature",
]
categories = ["cryptography", "no-std"]
# The published crate does not need the marketing page, the fuzz corpus or
# the CI scaffolding; keep it to code, tests and the security docs.
# The dev scripts (which include C helpers for regenerating the fixtures)
# are excluded too: nothing in the published crate compiles or needs them.
exclude = [
    "docs/article/*",
    "fuzz/*",
    "scripts/*",
    ".github/*",
    "Dockerfile",
    ".dockerignore",
]

[package.metadata.docs.rs]
features = ["round3", "serde"]

[features]
default = ["std"]
std = ["getrandom", "falcon-round3?/std"]
serde = ["dep:serde", "zeroize/serde", "falcon-round3?/serde"]
# Branchless integer floating-point backend: removes the floating-point
# timing side channel, at a performance cost. Results are bit-identical.
fpemu = ["falcon-round3?/fpemu"]
# The round-3 Falcon API of falcon-rs 0.3.x, as `falcon::round3`, plus key
# conversion to FN-DSA. It is the published 0.3.1 crate itself, so its
# formats and behaviour are exactly 0.3.1's.
round3 = ["dep:falcon-round3"]

[dependencies]
falcon-round3 = { package = "falcon-rs", version = "=0.3.1", optional = true, default-features = false }
getrandom = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
zeroize = { version = "1", features = ["alloc"], default-features = false }

[lib]
name = "falcon"
path = "src/lib.rs"









[dev-dependencies]
serde_json = "1"
# Used by the unit tests carried over from rust-fn-dsa (dev-only, pure Rust).
hex = "0.4"
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "falcon_bench"
harness = false

[profile.release]
opt-level = 3
