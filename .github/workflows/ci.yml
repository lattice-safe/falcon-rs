name: CI

on:
  push:
    branches: [main, master, 'v*']
  pull_request:
    branches: [main, master, 'v*']

# Least privilege: jobs only read the repository. The audit job, which
# publishes a check run, gets its extra scope locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test --release
      - run: cargo test --release --features serde

  round3:
    name: Round-3 compatibility (falcon-rs 0.3.1) and key conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: 0.3.1 byte-compatibility and conversion, native backend
        run: cargo test --release --features round3,serde
      - name: The same with the emulated backend
        run: cargo test --release --features round3,fpemu
      - name: no_std build with round3
        run: cargo build --no-default-features --features round3

  fpemu:
    name: Constant-time FP backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: KAT vectors and differential tests with the emulated backend
        run: cargo test --release --features fpemu
      - name: no_std build with the emulated backend
        run: cargo build --no-default-features --features fpemu
      - name: No floating-point instructions in the fpemu build
        run: ./scripts/check_no_fp.sh
      - name: The check itself detects the native build's FP instructions
        run: |
          if ./scripts/check_no_fp.sh --native; then
            echo "check_no_fp.sh passed the native build: the check is broken"
            exit 1
          fi

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked
      # A 60-second run per target is a smoke test, not a campaign: it keeps
      # the targets building and catches an obvious regression. The README
      # says "fuzz tested" — this is what stands behind that in CI.
      - name: Fuzz each target briefly
        run: |
          for target in fuzz_sign_verify fuzz_verify_reject fuzz_codec_roundtrip; do
            cargo fuzz run "$target" -- -max_total_time=60 -print_final_stats=1
          done

  miri:
    name: Miri (undefined behaviour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: miri
      # The crate is #![forbid(unsafe_code)]; Miri still checks the full
      # keygen/sign/verify path for overflow and out-of-bounds panics at a
      # toy degree (real degrees are far too slow under the interpreter).
      - name: Keygen/sign/verify cycle under Miri
        run: cargo +nightly miri test --features fpemu --test miri_cycle
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  c-parity:
    name: Bit-exact with the C reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Build c-fn-dsa, run its suite, re-derive every fixture, compare
        run: ./scripts/verify_c_parity.sh

  dudect:
    name: Timing measurements (dudect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Welch t-test on the emulated backend and the signing path
        run: cargo test --release --features fpemu --test dudect -- --ignored --nocapture --test-threads=1
      # The native backend is not claimed to be constant-time — hardware FP
      # timing is a CPU property. Its numbers are logged for comparison but
      # must not fail the build.
      - name: Same measurements on the native backend (reported, not gated)
        continue-on-error: true
        run: cargo test --release --test dudect -- --ignored --nocapture --test-threads=1

  msrv:
    name: MSRV (1.84)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@0dc504e9a0ea0915becab720ea9f0a9d0955ba5b # 1.84
      - run: cargo check
      - run: cargo check --features fpemu
      - run: cargo check --no-default-features
      # round3 pulls falcon-rs 0.3.1 and its zeroize_derive; Cargo.lock pins a
      # version that still builds on 1.84.
      - run: cargo check --locked --features round3,serde

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      # --all-features enables `fpemu`, which cfg's the native backend out, so
      # lint both configurations or half the crate goes unchecked.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      # `dead_code` is not allowed crate-wide, and which items are dead
      # depends on the feature set and the target, so lint no_std too.
      - run: cargo clippy --no-default-features -- -D warnings
      - run: cargo clippy --no-default-features --features fpemu -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The default build compiles the emulated backend out, so its docs went
      # unchecked until an `--all-features` run caught broken links in them.
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --no-default-features --release

  no_std:
    name: no_std Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo build --no-default-features

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo bench --no-run

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@c2e5d2ce8920c881761c4cabb41434daa1f95687 # cargo-llvm-cov
      - name: Pure Rust + 100% coverage of src/ (both backends)
        run: ./scripts/c-fn-dsa/gate.sh
